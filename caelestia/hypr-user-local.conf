# Personal Hyprland prefs — install-caelestia*.sh only creates this file if missing (never overwrites).
# Default kb_layout br keeps ABNT2 dead keys; do not set kb_variant = nodeadkeys here unless you want that.

input {
    kb_layout = br
    follow_mouse = 1
}

cursor {
    no_hardware_cursors = true
}

group {
    drag_into_group = 1
}

# Side mouse buttons — same UX as on 0.55.2:
#   hold mouse4 + LMB drag = move, + RMB drag = resize
#   hold mouse5 + LMB click = togglegroup / moveoutofgroup
#
# Hyprland 0.56 matches release binds against the submap active at *press*
# (submapAtPress), not the current submap. Put bindr in global so releasing
# the thumb exits; bindr inside mousedragthumb/mouse5group never fires.
submap = global
bind = , mouse:275, exec, bash $HOME/.config/caelestia/scripts/hypr-mouse-submap-if-not-steam-game.sh mousedragthumb
bindr = , mouse:275, submap, global
bind = , mouse:276, exec, bash $HOME/.config/caelestia/scripts/hypr-mouse-submap-if-not-steam-game.sh mouse5group
bindr = , mouse:276, submap, global

submap = mousedragthumb
bindm = , mouse:272, movewindow
bindm = , mouse:273, resizewindow
bind = , escape, submap, global

submap = mouse5group
bindc = , mouse:272, exec, bash $HOME/.config/caelestia/scripts/hypr-group-mouse5.sh
bind = , escape, submap, global

submap = global

# Lan Mouse — tray + background daemon (lan-kvm-hyprland)
exec-once = bash -c 'pgrep -f "[l]an-mouse-tray.py" >/dev/null || exec bash /home/lpacheco/Projects/lan-kvm-hyprland/arch-hyprland/scripts/lan-mouse-session.sh'

# Local LLM — Ollama + Open WebUI tray
exec-once = bash -c 'pgrep -f "[l]lm-tray.py" >/dev/null || exec bash /home/lpacheco/Projects/gemma4-heretic/llm-tray-session.sh'
