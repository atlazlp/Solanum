# Quantum Moon kitty integration. Included from ~/.config/kitty/kitty.conf by install.sh
# (marker block "# BEGIN solanum" / "# END solanum").
# listen_on + allow_remote_control let qm-apply recolour running terminals;
# colors-solanum.conf is regenerated by qm-sync-file-manager-theme.py on every palette change.
listen_on unix:${XDG_RUNTIME_DIR}/kitty-solanum.sock
allow_remote_control socket
include colors-solanum.conf
